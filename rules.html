<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>规则介绍 · 究极井字棋 v1.2.0</title>
<link rel="stylesheet" href="css/style.css">
</head>
<!-- data-mode="readonly" → 只读演示，不可落子 -->
<body data-mode="readonly">

<canvas id="sky"></canvas>

<!-- 通用弹窗 -->
<div id="modal" class="modal-mask">
  <div class="modal-box">
    <div class="modal-icon" id="modalIcon">🚧</div>
    <div class="modal-title" id="modalTitle">暂未开放</div>
    <div class="modal-text" id="modalText">该功能正在开发中，敬请期待</div>
    <div class="modal-actions" id="modalActions">
      <button class="modal-btn primary" id="modalOk">知道了</button>
      <button class="modal-btn ghost" id="modalCancel">取消</button>
    </div>
  </div>
</div>

<!-- 规则介绍页：只读棋盘演示 -->
<div class="wrap" id="game">
  <h1>✦ 规则介绍 ✦</h1>
  <div class="ver-line">v1.2.0</div>

  <div class="toolbar">
    <button id="back">← 主页</button>
  </div>

  <div id="status">📖 规则介绍 · 仅供演示，不可落子</div>

  <div class="playarea">
    <div class="score x" id="scoreBoxX">
      <span class="crown" id="crownX"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M3 7l4 3 5-6 5 6 4-3-1.5 11h-15L3 7z" fill="#f6b93b"/><path d="M3 7l1.5 11h15L21 7l-4 3-5-6-5 6-4-3z" fill="none" stroke="#d99a1b" stroke-width="1"/><rect x="4.5" y="18" width="15" height="2.5" rx="1" fill="#d99a1b"/></svg></span>
      <span class="label" id="labelX">✕ 交小薇</span>
      <span class="num" id="scoreX">0</span>
    </div>

    <div id="board"></div>

    <div class="score o" id="scoreBoxO">
      <span class="crown" id="crownO"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M3 7l4 3 5-6 5 6 4-3-1.5 11h-15L3 7z" fill="#f6b93b"/><path d="M3 7l1.5 11h15L21 7l-4 3-5-6-5 6-4-3z" fill="none" stroke="#d99a1b" stroke-width="1"/><rect x="4.5" y="18" width="15" height="2.5" rx="1" fill="#d99a1b"/></svg></span>
      <span class="label">◯ 玩家</span>
      <span class="num" id="scoreO">0</span>
    </div>
  </div>

  <!-- galgame 对话框：逐字显示台词，展现完毕 0.2s 后点击任意位置继续 -->
  <div id="dialogue">
    <div class="dlg-name" id="dlgName">交小薇</div>
    <div class="dlg-text" id="dlgText"></div>
    <div class="dlg-next" id="dlgNext">▼</div>
    <!-- 教程讲完后弹出的两个选项（由 js/dialogue.js 动态生成按钮） -->
    <div class="dlg-choices" id="dlgChoices"></div>
  </div>
</div>

<!-- 页脚 -->
<div class="footer">
  作者：<a href="https://space.bilibili.com/510463176/" target="_blank" rel="noopener">拾柒ACTV</a>
  &nbsp;·&nbsp; 由 <a href="https://www.workbuddy.cn/" target="_blank" rel="noopener">WorkBuddy</a> 制作
  &nbsp;·&nbsp; 感谢您的游玩！
</div>

<script src="js/sky.js"></script>
<script src="js/modal.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
